<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Blockfall</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg:#07060f;
    --panel:#0f0d1f;
    --edge:#241f42;
    --text:#e8e6ff;
    --dim:#7b74a8;
    --accent:#ff2d95;
    --rail:clamp(52px,17vw,88px);
  }

  html, body {
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:var(--bg);
    color:var(--text);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }

  #app {
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #hud {
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center;
    padding:10px 12px 7px;
  }

  .label { font-size:9px; letter-spacing:.18em; color:var(--dim); }

  #scoreBox { display:flex; flex-direction:column; align-items:center; gap:2px; }
  #scoreBox .label { font-size:10px; letter-spacing:.3em; }
  #score {
    font-size:clamp(30px,10.5vw,48px); font-weight:800; line-height:1;
    letter-spacing:.04em; font-variant-numeric:tabular-nums;
    color:var(--text); text-shadow:0 0 16px var(--accent), 0 0 40px var(--accent);
  }

  #subStats { display:flex; gap:24px; margin-top:7px; }
  .stat { display:flex; align-items:baseline; gap:6px; }
  .stat b {
    font-size:clamp(14px,4.6vw,20px); font-weight:700; letter-spacing:.03em;
    font-variant-numeric:tabular-nums;
  }

  #stage {
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    min-height:0; padding:0 10px 10px;
  }

  .rail {
    width:var(--rail); flex:0 0 var(--rail); align-self:stretch;
    display:flex; flex-direction:column; gap:8px;
  }

  .slot {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:var(--panel);
    border:1px solid var(--edge);
    border-radius:6px;
    padding:4px 3px 5px;
  }
  .slot .label { font-size:8px; letter-spacing:.14em; }

  #sysBtns { display:flex; flex-direction:column; gap:6px; align-items:center; margin-top:auto; }
  .sysBtn {
    width:34px; height:34px; border-radius:6px;
    background:var(--panel); border:1px solid var(--edge); color:var(--dim);
    font-size:14px; line-height:1; cursor:pointer;
  }
  .sysBtn:active { color:var(--text); border-color:var(--accent); }

  #boardWrap { position:relative; flex:0 0 auto; }

  #board {
    display:block;
    border-radius:2px;
    box-shadow:0 0 0 1px var(--edge), 0 0 46px -8px var(--accent);
  }

  #scanlines {
    position:absolute; inset:0; border-radius:2px; pointer-events:none;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 4px);
    mix-blend-mode:multiply;
  }

  #toast {
    position:absolute; left:50%; top:26%;
    transform:translate(-50%,-50%);
    font-size:clamp(17px,6vw,26px); font-weight:700; letter-spacing:.1em;
    text-align:center; white-space:nowrap; pointer-events:none; opacity:0;
    text-shadow:0 0 18px currentColor;
  }

  #overlay {
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:rgba(7,6,15,.9);
    backdrop-filter:blur(3px);
    text-align:center; padding:24px;
  }
  #overlay.hidden { display:none; }

  #overlay h1 {
    font-size:clamp(30px,11vw,52px); font-weight:800; letter-spacing:.13em;
    color:var(--accent); text-shadow:0 0 26px var(--accent), 0 0 60px var(--accent);
  }
  #overlay h2 { font-size:clamp(19px,6.5vw,28px); letter-spacing:.12em; font-weight:700; }
  #overlay p { color:var(--dim); font-size:13px; line-height:1.75; letter-spacing:.05em; }
  #overlay .big { color:var(--text); font-size:clamp(22px,8vw,34px); font-variant-numeric:tabular-nums; }
  #overlay .cta { color:var(--text); font-size:13px; letter-spacing:.2em; animation:pulse 1.7s ease-in-out infinite; }

  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div id="scoreBox">
      <span class="label">SCORE</span>
      <b id="score">0</b>
    </div>
    <div id="subStats">
      <div class="stat"><span class="label">LEVEL</span><b id="level">1</b></div>
      <div class="stat"><span class="label">LINES</span><b id="lines">0</b></div>
    </div>
  </header>

  <main id="stage">
    <aside class="rail" id="railLeft">
      <div class="slot">
        <span class="label">HOLD</span>
        <canvas id="holdCanvas"></canvas>
      </div>
      <div id="sysBtns">
        <button class="sysBtn" id="pauseBtn" aria-label="Pause">❚❚</button>
        <button class="sysBtn" id="muteBtn" aria-label="Mute">♪</button>
      </div>
    </aside>

    <div id="boardWrap">
      <canvas id="board"></canvas>
      <div id="scanlines"></div>
      <div id="toast"></div>
    </div>

    <aside class="rail" id="railRight">
      <div class="slot">
        <span class="label">NEXT</span>
        <canvas id="nextCanvas"></canvas>
      </div>
    </aside>
  </main>

  <div id="overlay"></div>
</div>

<script>
(() => {
'use strict';

const COLS = 10, VIS_ROWS = 20, HIDDEN = 2, ROWS = VIS_ROWS + HIDDEN;

const THEMES = {
  neon: {
    name: 'Neon',
    bg: '#07060f', panel: '#0f0d1f', edge: '#241f42',
    text: '#e8e6ff', dim: '#7b74a8', accent: '#ff2d95',
    well: '#0a0819', gridLine: 'rgba(120,100,220,.09)',
    scanlines: true,
    pieces: { I:'#22e8ff', J:'#4d6bff', L:'#ff9d24', O:'#ffe14d', S:'#3dff96', T:'#c14dff', Z:'#ff2f68' },
  },
};
let theme = THEMES.neon;

const SHAPES = {
  I: ['....','IIII','....','....'],
  J: ['J..','JJJ','...'],
  L: ['..L','LLL','...'],
  O: ['OO','OO'],
  S: ['.SS','SS.','...'],
  T: ['.T.','TTT','...'],
  Z: ['ZZ.','.ZZ','...'],
};
const TYPES = Object.keys(SHAPES);

// SRS kicks, already converted to screen space (+y is down).
const KICKS = {
  JLSTZ: {
    '0>1':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
    '1>0':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],
    '1>2':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],
    '2>1':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
    '2>3':[[0,0],[1,0],[1,-1],[0,2],[1,2]],
    '3>2':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
    '3>0':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
    '0>3':[[0,0],[1,0],[1,-1],[0,2],[1,2]],
  },
  I: {
    '0>1':[[0,0],[-2,0],[1,0],[-2,1],[1,-2]],
    '1>0':[[0,0],[2,0],[-1,0],[2,-1],[-1,2]],
    '1>2':[[0,0],[-1,0],[2,0],[-1,-2],[2,1]],
    '2>1':[[0,0],[1,0],[-2,0],[1,2],[-2,-1]],
    '2>3':[[0,0],[2,0],[-1,0],[2,-1],[-1,2]],
    '3>2':[[0,0],[-2,0],[1,0],[-2,1],[1,-2]],
    '3>0':[[0,0],[-1,0],[2,0],[-1,-2],[2,1]],
    '0>3':[[0,0],[1,0],[-2,0],[1,2],[-2,-1]],
  },
};

const ROTATIONS = {};
for (const type of TYPES) {
  const base = SHAPES[type].map(row => [...row].map(c => c === '.' ? null : c));
  ROTATIONS[type] = [base];
  for (let i = 1; i < 4; i++) ROTATIONS[type].push(rotateCW(ROTATIONS[type][i - 1]));
}

function rotateCW(m) {
  const n = m.length;
  const out = Array.from({ length: n }, () => Array(n).fill(null));
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) out[x][n - 1 - y] = m[y][x];
  return out;
}

const LINE_SCORES = [0, 100, 300, 500, 800];
const TSPIN_SCORES = [400, 800, 1200, 1600];
const TSPIN_MINI_SCORES = [100, 200, 400, 400];
const PERFECT_SCORES = [0, 800, 1200, 1800, 2000];

// Tunable feel — adjust after real-hands testing.
const CTRL = {
  moveStep: 0.55,   // cells of finger travel per horizontal step
  softStep: 0.70,   // cells of finger travel per soft-drop step
  flickVel: 0.95,   // px/ms downward that counts as a hard-drop flick
  flickDist: 1.30,  // cells of downward travel required for a flick
  holdSwipe: 1.20,  // cells of upward travel that trigger hold
  tapDist: 12,      // px of travel still considered a tap
  tapTime: 260,     // ms
  das: 150, arr: 33, softRepeat: 28, // keyboard
};

const LOCK_DELAY = 500, MAX_LOCK_RESETS = 15, CLEAR_TIME = 190;
const DEATH_ROW_MS = 34, DEATH_HOLD_MS = 280;

const $ = id => document.getElementById(id);
const boardCv = $('board'), boardCtx = boardCv.getContext('2d');
const holdCv = $('holdCanvas'), holdCtx = holdCv.getContext('2d');
const nextCv = $('nextCanvas'), nextCtx = nextCv.getContext('2d');
const overlay = $('overlay'), toastEl = $('toast'), stage = $('stage'), railLeft = $('railLeft');

let grid, active, queue, hold, canHold, bag;
let state = 'menu';
let score, lines, level, combo, backToBack, stats;
let gravityAcc, lockTimer, lockResets, grounded, lastKick, rotatedLast;
let clearRows, clearTimer, pendingClear;
let deathRow, deathTimer;
let particles, shake, cell, dpr, wellCanvas, previewSize;
let lastFrame = 0;

// ---------- persistence ----------

const STORE = 'blockfall.stats';
function loadStats() {
  try { return { best: 0, bestLines: 0, bestCombo: 0, ...JSON.parse(localStorage.getItem(STORE) || '{}') }; }
  catch { return { best: 0, bestLines: 0, bestCombo: 0 }; }
}
function saveStats() {
  try { localStorage.setItem(STORE, JSON.stringify(stats)); } catch {}
}

// ---------- audio ----------

const Sound = {
  ctx: null,
  muted: localStorage.getItem('blockfall.muted') === '1',
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type = 'square', gain = 0.05, delay = 0) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator(), amp = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    amp.gain.setValueAtTime(gain, t);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(amp).connect(this.ctx.destination);
    osc.start(t); osc.stop(t + dur);
  },
  arp(freqs, step = 0.055, type = 'square', gain = 0.05) {
    freqs.forEach((f, i) => this.tone(f, 0.11, type, gain, i * step));
  },
  move()    { this.tone(180, 0.03, 'square', 0.028); },
  rotate()  { this.tone(340, 0.04, 'square', 0.032); },
  lock()    { this.tone(110, 0.07, 'triangle', 0.05); },
  holdSfx() { this.tone(500, 0.06, 'sine', 0.045); },
  drop()    { this.tone(76, 0.10, 'sawtooth', 0.045); },
  clear(n)  { this.arp(n >= 4 ? [523, 659, 784, 1047, 1319] : [440, 587, 740].slice(0, n + 1), 0.05, 'square', 0.05); },
  tspin()   { this.arp([392, 587, 880, 1175], 0.05, 'sine', 0.06); },
  levelUp() { this.arp([523, 784, 1047], 0.07, 'triangle', 0.05); },
  curtain(i){ this.tone(Math.max(90, 300 - i * 9), 0.05, 'square', 0.022); },
  over()    { this.arp([392, 330, 262, 196], 0.11, 'sawtooth', 0.055); },
};

// ---------- sprites ----------

const sprites = new Map();

// Hard-edged square with a classic raised bevel: lit top/left, shaded bottom/right.
// The neon glow is baked in here so nothing needs shadowBlur at frame time.
function blockSprite(color, size) {
  const key = color + '@' + size;
  if (sprites.has(key)) return sprites.get(key);

  const pad = Math.ceil(size * 0.5);
  const cv = document.createElement('canvas');
  cv.width = cv.height = size + pad * 2;
  const g = cv.getContext('2d');
  g.translate(pad, pad);

  const gap = Math.max(1, Math.round(size * 0.045));
  const x0 = gap, y0 = gap, s = size - gap * 2;
  const b = Math.max(1, Math.round(s * 0.16));

  g.shadowColor = color;
  g.shadowBlur = size * 0.42;
  g.fillStyle = color;
  g.fillRect(x0, y0, s, s);
  g.fillRect(x0, y0, s, s);
  g.shadowBlur = 0;

  g.beginPath();
  g.moveTo(x0, y0); g.lineTo(x0 + s, y0);
  g.lineTo(x0 + s - b, y0 + b); g.lineTo(x0 + b, y0 + b);
  g.lineTo(x0 + b, y0 + s - b); g.lineTo(x0, y0 + s);
  g.closePath();
  g.fillStyle = 'rgba(255,255,255,.5)';
  g.fill();

  g.beginPath();
  g.moveTo(x0 + s, y0); g.lineTo(x0 + s, y0 + s); g.lineTo(x0, y0 + s);
  g.lineTo(x0 + b, y0 + s - b); g.lineTo(x0 + s - b, y0 + s - b); g.lineTo(x0 + s - b, y0 + b);
  g.closePath();
  g.fillStyle = 'rgba(0,0,0,.42)';
  g.fill();

  g.strokeStyle = 'rgba(255,255,255,.28)';
  g.lineWidth = 1;
  g.strokeRect(x0 + .5, y0 + .5, s - 1, s - 1);

  const sprite = { cv, pad };
  sprites.set(key, sprite);
  return sprite;
}

function ghostSprite(color, size) {
  const key = 'ghost' + color + '@' + size;
  if (sprites.has(key)) return sprites.get(key);
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const g = cv.getContext('2d');
  const gap = Math.max(1, Math.round(size * 0.045));
  const lw = Math.max(1, Math.round(size * 0.08));
  g.globalAlpha = 0.45;
  g.strokeStyle = color;
  g.lineWidth = lw;
  g.strokeRect(gap + lw / 2, gap + lw / 2, size - gap * 2 - lw, size - gap * 2 - lw);
  g.globalAlpha = 0.09;
  g.fillStyle = color;
  g.fillRect(gap, gap, size - gap * 2, size - gap * 2);
  const sprite = { cv, pad: 0 };
  sprites.set(key, sprite);
  return sprite;
}

const grayCache = new Map();
function grayOf(hex) {
  let out = grayCache.get(hex);
  if (out) return out;
  const n = parseInt(hex.slice(1), 16);
  const lum = 0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
  const v = Math.round(38 + lum * 0.4);
  out = '#' + ((v << 16) | (v << 8) | v).toString(16).padStart(6, '0');
  grayCache.set(hex, out);
  return out;
}

// ---------- layout ----------

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);

  const railW = railLeft.getBoundingClientRect().width;
  const availW = stage.clientWidth - 20 - railW * 2 - 16; // padding + both rails + gaps
  const availH = stage.clientHeight - 10;
  cell = Math.max(8, Math.floor(Math.min(availW / COLS, availH / VIS_ROWS)));

  const w = cell * COLS, h = cell * VIS_ROWS;
  boardCv.style.width = w + 'px';
  boardCv.style.height = h + 'px';
  boardCv.width = Math.round(w * dpr);
  boardCv.height = Math.round(h * dpr);
  boardCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Previews are width-bound: every spawn orientation is at most 4 cells wide
  // and 2 tall, so size off the rail's inner width and let height follow.
  const inner = railW - 10;
  previewSize = Math.max(7, Math.floor((inner - 2) / 4));
  sizeMini(holdCv, holdCtx, previewSize * 4 + 2, previewSize * 2 + 4);
  sizeMini(nextCv, nextCtx, previewSize * 4 + 2, (previewSize * 2 + 8) * 3);

  sprites.clear();
  buildWell();
  drawSidePanels();
}

function sizeMini(cv, ctx, w, h) {
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function buildWell() {
  const w = cell * COLS, h = cell * VIS_ROWS;
  wellCanvas = document.createElement('canvas');
  wellCanvas.width = Math.round(w * dpr);
  wellCanvas.height = Math.round(h * dpr);
  const g = wellCanvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  g.fillStyle = theme.well;
  g.fillRect(0, 0, w, h);

  g.strokeStyle = theme.gridLine;
  g.lineWidth = 1;
  g.beginPath();
  for (let x = 1; x < COLS; x++) { g.moveTo(x * cell + .5, 0); g.lineTo(x * cell + .5, h); }
  for (let y = 1; y < VIS_ROWS; y++) { g.moveTo(0, y * cell + .5); g.lineTo(w, y * cell + .5); }
  g.stroke();

  const vig = g.createRadialGradient(w / 2, h / 2, h * 0.25, w / 2, h / 2, h * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,.45)');
  g.fillStyle = vig;
  g.fillRect(0, 0, w, h);
}

// ---------- piece helpers ----------

function refillBag() {
  bag = [...TYPES];
  for (let i = bag.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [bag[i], bag[j]] = [bag[j], bag[i]];
  }
}

function nextType() {
  if (!bag || !bag.length) refillBag();
  return bag.pop();
}

function fillQueue() {
  while (queue.length < 5) queue.push(nextType());
}

function makePiece(type) {
  return { type, rot: 0, x: type === 'O' ? 4 : 3, y: 0, m: ROTATIONS[type][0] };
}

function topRow(m) {
  for (let y = 0; y < m.length; y++) if (m[y].some(Boolean)) return y;
  return 0;
}

function collides(m, px, py) {
  for (let y = 0; y < m.length; y++) {
    for (let x = 0; x < m.length; x++) {
      if (!m[y][x]) continue;
      const gx = px + x, gy = py + y;
      if (gx < 0 || gx >= COLS || gy >= ROWS) return true;
      if (gy >= 0 && grid[gy][gx]) return true;
    }
  }
  return false;
}

// Settles a new piece into the top of the visible field so it never appears
// half-cut by the hidden buffer rows.
function enterPiece(piece) {
  if (collides(piece.m, piece.x, piece.y)) { gameOver(); return false; }
  const top = topRow(piece.m);
  while (piece.y + top < HIDDEN && !collides(piece.m, piece.x, piece.y + 1)) piece.y++;
  active = piece;
  rotatedLast = false;
  lastKick = 0;
  resetLockState();
  drawSidePanels();
  return true;
}

function spawn() {
  fillQueue();
  const piece = makePiece(queue.shift());
  fillQueue();
  if (!enterPiece(piece)) return;
  canHold = true;
}

function resetLockState() {
  grounded = false;
  lockTimer = 0;
  lockResets = 0;
}

function gravityInterval() {
  const l = Math.min(level, 20);
  return Math.max(16, Math.pow(0.8 - (l - 1) * 0.007, l - 1) * 1000);
}

// ---------- actions ----------

function move(dx) {
  if (!active || collides(active.m, active.x + dx, active.y)) return false;
  active.x += dx;
  rotatedLast = false;
  touchLock();
  Sound.move();
  return true;
}

function rotate(dir) {
  if (!active || active.type === 'O') return false;
  const from = active.rot, to = (from + (dir > 0 ? 1 : 3)) % 4;
  const m = ROTATIONS[active.type][to];
  const table = (active.type === 'I' ? KICKS.I : KICKS.JLSTZ)[from + '>' + to];
  for (let i = 0; i < table.length; i++) {
    const [kx, ky] = table[i];
    if (!collides(m, active.x + kx, active.y + ky)) {
      active.rot = to; active.m = m;
      active.x += kx; active.y += ky;
      rotatedLast = true;
      lastKick = i;
      touchLock();
      Sound.rotate();
      return true;
    }
  }
  return false;
}

function softDrop() {
  if (!active || collides(active.m, active.x, active.y + 1)) return false;
  active.y++;
  score += 1;
  rotatedLast = false;
  gravityAcc = 0;
  resetLockState();
  updateHud();
  return true;
}

function hardDrop() {
  if (!active) return;
  let dist = 0;
  while (!collides(active.m, active.x, active.y + 1)) { active.y++; dist++; }
  score += dist * 2;
  if (dist > 0) rotatedLast = false; // a 0-cell drop must not cancel a T-spin
  shake = Math.min(9, 2.5 + dist * 0.35);
  Sound.drop();
  lockPiece();
}

function holdPiece() {
  if (!active || !canHold) return;
  const swap = hold;
  hold = active.type;
  if (swap) {
    if (!enterPiece(makePiece(swap))) return;
  } else {
    spawn();
    if (state !== 'playing') return;
  }
  canHold = false; // must follow spawn(), which re-arms the hold
  drawSidePanels();
  Sound.holdSfx();
}

function touchLock() {
  if (!grounded) return;
  if (lockResets < MAX_LOCK_RESETS) { lockTimer = 0; lockResets++; }
}

// ---------- locking & clearing ----------

function tSpinType() {
  if (active.type !== 'T' || !rotatedLast) return null;
  const cx = active.x + 1, cy = active.y + 1;
  const blocked = (x, y) => x < 0 || x >= COLS || y >= ROWS || (y >= 0 && !!grid[y][x]);
  // TL, TR, BL, BR
  const corners = [blocked(cx - 1, cy - 1), blocked(cx + 1, cy - 1), blocked(cx - 1, cy + 1), blocked(cx + 1, cy + 1)];
  if (corners.filter(Boolean).length < 3) return null;
  const fronts = [[0, 1], [1, 3], [2, 3], [0, 2]][active.rot];
  if (fronts.every(i => corners[i])) return 'full';
  return lastKick === 4 ? 'full' : 'mini';
}

function lockPiece() {
  const spin = tSpinType();
  let anyVisible = false;

  for (let y = 0; y < active.m.length; y++) {
    for (let x = 0; x < active.m.length; x++) {
      if (!active.m[y][x]) continue;
      const gy = active.y + y, gx = active.x + x;
      if (gy >= 0) grid[gy][gx] = active.type;
      if (gy >= HIDDEN) anyVisible = true;
    }
  }

  const full = [];
  for (let y = 0; y < ROWS; y++) if (grid[y].every(Boolean)) full.push(y);

  if (!anyVisible && !full.length) { active = null; gameOver(); return; }

  if (full.length) {
    spawnClearParticles(full);
    pendingClear = { rows: full, spin };
    clearRows = full;
    clearTimer = CLEAR_TIME;
    state = 'clearing';
    active = null;
  } else {
    if (spin) applyScore(0, spin);
    else { combo = -1; Sound.lock(); }
    active = null;
    spawn();
  }
}

function finishClear() {
  const { rows, spin } = pendingClear;
  const kept = grid.filter((_, y) => !rows.includes(y));
  while (kept.length < ROWS) kept.unshift(Array(COLS).fill(null));
  grid = kept;
  applyScore(rows.length, spin);
  pendingClear = null; clearRows = null;
  state = 'playing';
  spawn();
}

function applyScore(cleared, spin) {
  const prevLevel = level;
  let gain = 0, label = '', color = theme.accent;

  if (spin) {
    const table = spin === 'full' ? TSPIN_SCORES : TSPIN_MINI_SCORES;
    gain = table[cleared] * level;
    label = (spin === 'mini' ? 'T-SPIN MINI' : 'T-SPIN') + ['', ' SINGLE', ' DOUBLE', ' TRIPLE'][cleared];
    color = theme.pieces.T;
  } else if (cleared) {
    gain = LINE_SCORES[cleared] * level;
    if (cleared === 4) { label = 'TETRIS'; color = theme.pieces.I; }
  }

  const difficult = cleared > 0 && (spin || cleared === 4);
  if (difficult) {
    if (backToBack) { gain = Math.round(gain * 1.5); label = 'B2B ' + label; }
    backToBack = true;
  } else if (cleared) {
    backToBack = false;
  }

  if (cleared) {
    combo++;
    if (combo > 0) {
      gain += 50 * combo * level;
      if (!label) { label = combo + 1 + '× COMBO'; }
      else label += '  ' + (combo + 1) + '×';
    }
    stats.bestCombo = Math.max(stats.bestCombo, combo + 1);

    lines += cleared;
    level = Math.floor(lines / 10) + 1;

    if (grid.every(row => row.every(c => !c))) {
      gain += PERFECT_SCORES[cleared] * level;
      label = 'PERFECT CLEAR';
      color = '#ffffff';
      shake = Math.max(shake, 10);
    }
    if (cleared >= 4) shake = Math.max(shake, 8);

    if (spin) Sound.tspin(); else Sound.clear(cleared);
  } else {
    combo = -1;
    if (spin) { label = 'T-SPIN'; color = theme.pieces.T; Sound.tspin(); }
  }

  score += gain;
  if (level > prevLevel) { Sound.levelUp(); showToast('LEVEL ' + level, theme.pieces.S); }
  else if (label) showToast(label, color);

  updateHud();
}

function spawnClearParticles(rows) {
  for (const y of rows) {
    for (let x = 0; x < COLS; x++) {
      const color = theme.pieces[grid[y][x]] || theme.accent;
      const count = 3;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: (x + Math.random()) * cell,
          y: (y - HIDDEN + Math.random()) * cell,
          vx: (Math.random() - 0.5) * 0.34,
          vy: (Math.random() - 0.85) * 0.22,
          life: 1, decay: 0.0016 + Math.random() * 0.0016,
          size: cell * (0.12 + Math.random() * 0.16),
          color,
        });
      }
    }
  }
  if (particles.length > 700) particles.splice(0, particles.length - 700);
}

// ---------- game flow ----------

function startGame() {
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  queue = []; bag = null; hold = null; canHold = true;
  score = 0; lines = 0; level = 1; combo = -1; backToBack = false;
  gravityAcc = 0; particles = []; shake = 0;
  clearRows = null; pendingClear = null;
  deathRow = ROWS; deathTimer = 0;
  state = 'playing';
  hideOverlay();
  fillQueue();
  spawn();
  updateHud();
}

// Death is a two-beat sequence: a grey curtain sweeps up from the floor,
// then the summary appears.
function gameOver() {
  if (state === 'dying' || state === 'over') return;
  state = 'dying';
  active = null;
  deathRow = ROWS;
  deathTimer = 0;
}

function finishGameOver() {
  state = 'over';
  Sound.over();
  stats.best = Math.max(stats.best, score);
  stats.bestLines = Math.max(stats.bestLines, lines);
  saveStats();
  showOverlay(`
    <h2>GAME OVER</h2>
    <div>
      <p>SCORE</p>
      <div class="big">${score.toLocaleString()}</div>
    </div>
    <p>LINES ${lines} &nbsp;·&nbsp; LEVEL ${level}<br>BEST ${stats.best.toLocaleString()}</p>
    <p class="cta">TAP TO PLAY AGAIN</p>
  `);
}

function togglePause() {
  if (state === 'playing' || state === 'clearing') {
    state = state === 'clearing' ? 'pausedClearing' : 'paused';
    showOverlay('<h2>PAUSED</h2><p class="cta">TAP TO RESUME</p>');
  } else if (state === 'paused' || state === 'pausedClearing') {
    state = state === 'pausedClearing' ? 'clearing' : 'playing';
    hideOverlay();
  }
}

function showMenu() {
  state = 'menu';
  showOverlay(`
    <h1>BLOCKFALL</h1>
    <p>DRAG to move &nbsp;·&nbsp; TAP to rotate<br>
       FLICK DOWN to drop &nbsp;·&nbsp; SWIPE UP to hold<br>
       TWO-FINGER TAP to rotate back</p>
    ${stats.best ? `<p>BEST ${stats.best.toLocaleString()}</p>` : ''}
    <p class="cta">TAP TO PLAY</p>
  `);
}

function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove('hidden'); }
function hideOverlay() { overlay.classList.add('hidden'); }

function showToast(text, color) {
  toastEl.textContent = text;
  toastEl.style.color = color;
  toastEl.animate(
    [
      { opacity: 0, transform: 'translate(-50%,-50%) scale(.75)' },
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1)', offset: 0.22 },
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1)', offset: 0.65 },
      { opacity: 0, transform: 'translate(-50%,-90%) scale(.95)' },
    ],
    { duration: 1100, easing: 'ease-out' }
  );
}

function updateHud() {
  $('score').textContent = score.toLocaleString();
  $('level').textContent = level;
  $('lines').textContent = lines;
}

// ---------- update ----------

function update(dt) {
  if (shake > 0) shake = Math.max(0, shake - dt * 0.03);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 0.0011 * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (state === 'dying') {
    deathTimer += dt;
    while (deathRow > HIDDEN && deathTimer >= DEATH_ROW_MS) {
      deathTimer -= DEATH_ROW_MS;
      deathRow--;
      Sound.curtain(ROWS - 1 - deathRow);
    }
    if (deathRow <= HIDDEN && deathTimer >= DEATH_HOLD_MS) finishGameOver();
    return;
  }

  if (state === 'clearing') {
    clearTimer -= dt;
    if (clearTimer <= 0) finishClear();
    return;
  }
  if (state !== 'playing' || !active) return;

  updateKeyRepeat(dt);
  if (!active) return;

  gravityAcc += dt;
  const interval = gravityInterval();
  while (gravityAcc >= interval) {
    gravityAcc -= interval;
    if (!collides(active.m, active.x, active.y + 1)) {
      active.y++;
      rotatedLast = false;
      grounded = false;
      lockResets = 0;
    } else break;
  }

  const landed = collides(active.m, active.x, active.y + 1);
  if (landed) {
    if (!grounded) { grounded = true; lockTimer = 0; }
    lockTimer += dt;
    if (lockTimer >= LOCK_DELAY) lockPiece();
  } else {
    grounded = false;
    lockTimer = 0;
  }
}

// ---------- render ----------

function render() {
  const w = cell * COLS, h = cell * VIS_ROWS;
  boardCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  boardCtx.clearRect(0, 0, w, h);

  if (shake > 0) {
    boardCtx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  boardCtx.drawImage(wellCanvas, 0, 0, w, h);

  for (let y = HIDDEN; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const t = grid[y][x];
      if (!t) continue;
      const color = theme.pieces[t];
      drawBlock(boardCtx, x * cell, (y - HIDDEN) * cell, y >= deathRow ? grayOf(color) : color, cell);
    }
  }

  if (clearRows) {
    const flash = Math.max(0, clearTimer / CLEAR_TIME);
    boardCtx.fillStyle = `rgba(255,255,255,${0.15 + flash * 0.75})`;
    for (const y of clearRows) boardCtx.fillRect(0, (y - HIDDEN) * cell, w, cell);
  }

  if (active && state === 'playing') {
    let gy = active.y;
    while (!collides(active.m, active.x, gy + 1)) gy++;
    if (gy !== active.y) {
      forEachCell(active.m, (x, y) => {
        const sy = (gy + y - HIDDEN) * cell;
        if (sy > -cell) drawSprite(boardCtx, ghostSprite(theme.pieces[active.type], cell), (active.x + x) * cell, sy);
      });
    }
    forEachCell(active.m, (x, y) => {
      const sy = (active.y + y - HIDDEN) * cell;
      if (sy > -cell) drawBlock(boardCtx, (active.x + x) * cell, sy, theme.pieces[active.type], cell);
    });
  }

  for (const p of particles) {
    boardCtx.globalAlpha = Math.max(0, p.life);
    boardCtx.fillStyle = p.color;
    boardCtx.fillRect(p.x, p.y, p.size, p.size);
  }
  boardCtx.globalAlpha = 1;
}

function forEachCell(m, fn) {
  for (let y = 0; y < m.length; y++) for (let x = 0; x < m.length; x++) if (m[y][x]) fn(x, y);
}

function drawBlock(ctx, px, py, color, size) {
  drawSprite(ctx, blockSprite(color, size), px, py);
}

function drawSprite(ctx, sprite, px, py) {
  const s = sprite.cv.width;
  ctx.drawImage(sprite.cv, px - sprite.pad, py - sprite.pad, s, s);
}

function drawSidePanels() {
  drawMini(holdCtx, holdCv, hold ? [hold] : [], canHold ? 1 : 0.35);
  drawMini(nextCtx, nextCv, queue.slice(0, 3), 1);
}

function drawMini(ctx, cv, types, alpha) {
  const w = cv.width / dpr, h = cv.height / dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (!types.length) return;
  ctx.globalAlpha = alpha;

  const slotH = h / types.length;
  const size = previewSize;

  types.forEach((type, i) => {
    const m = ROTATIONS[type][0];
    let minX = 9, maxX = -1, minY = 9, maxY = -1;
    forEachCell(m, (x, y) => {
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    });
    const pw = (maxX - minX + 1) * size, ph = (maxY - minY + 1) * size;
    const ox = (w - pw) / 2 - minX * size;
    const oy = i * slotH + (slotH - ph) / 2 - minY * size;
    forEachCell(m, (x, y) => drawBlock(ctx, ox + x * size, oy + y * size, theme.pieces[type], size));
  });

  ctx.globalAlpha = 1;
}

// ---------- input: keyboard ----------

const keys = { left: 0, right: 0, down: 0 };
let dasTimer = 0, arrTimer = 0, softTimer = 0, dasDir = 0;

function updateKeyRepeat(dt) {
  const dir = keys.left && !keys.right ? -1 : keys.right && !keys.left ? 1 : 0;
  if (dir !== dasDir) { dasDir = dir; dasTimer = 0; arrTimer = 0; }
  if (dir) {
    dasTimer += dt;
    if (dasTimer >= CTRL.das) {
      arrTimer += dt;
      while (arrTimer >= CTRL.arr) { arrTimer -= CTRL.arr; move(dir); }
    }
  }
  if (keys.down) {
    softTimer += dt;
    while (softTimer >= CTRL.softRepeat) { softTimer -= CTRL.softRepeat; if (!softDrop()) break; }
  }
}

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (state === 'menu' || state === 'over') {
    if (e.key === ' ' || e.key === 'Enter') { Sound.init(); startGame(); }
    return;
  }
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); return; }
  if (state !== 'playing') return;

  switch (e.key) {
    case 'ArrowLeft':  keys.left = 1; move(-1); break;
    case 'ArrowRight': keys.right = 1; move(1); break;
    case 'ArrowDown':  keys.down = 1; softTimer = 0; softDrop(); break;
    case 'ArrowUp': case 'x': case 'X': rotate(1); break;
    case 'z': case 'Z': case 'Control': rotate(-1); break;
    case 'Shift': case 'c': case 'C': holdPiece(); break;
    case ' ': hardDrop(); break;
    default: return;
  }
  e.preventDefault();
});

document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') keys.left = 0;
  if (e.key === 'ArrowRight') keys.right = 0;
  if (e.key === 'ArrowDown') keys.down = 0;
});

// ---------- input: touch ----------

let gesture = null, extraPointers = 0;

overlay.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  Sound.init();
  if (state === 'menu' || state === 'over') startGame();
  else if (state === 'paused' || state === 'pausedClearing') togglePause();
});

stage.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (state !== 'playing') return;

  if (gesture) { extraPointers++; rotate(-1); return; }

  stage.setPointerCapture?.(e.pointerId);
  gesture = {
    id: e.pointerId,
    startX: e.clientX, startY: e.clientY,
    lastX: e.clientX, lastY: e.clientY,
    lastT: e.timeStamp, startT: e.timeStamp,
    accX: 0, accY: 0, maxDist: 0, dropped: false,
  };
});

stage.addEventListener('pointermove', e => {
  if (!gesture || e.pointerId !== gesture.id || gesture.dropped) return;

  const dx = e.clientX - gesture.lastX, dy = e.clientY - gesture.lastY;
  const dt = Math.max(1, e.timeStamp - gesture.lastT);
  gesture.lastX = e.clientX; gesture.lastY = e.clientY; gesture.lastT = e.timeStamp;

  const totalX = e.clientX - gesture.startX, totalY = e.clientY - gesture.startY;
  gesture.maxDist = Math.max(gesture.maxDist, Math.hypot(totalX, totalY));

  if (dy / dt > CTRL.flickVel && totalY > cell * CTRL.flickDist && Math.abs(totalY) > Math.abs(totalX)) {
    gesture.dropped = true;
    hardDrop();
    return;
  }

  gesture.accX += dx;
  const stepX = cell * CTRL.moveStep;
  while (Math.abs(gesture.accX) >= stepX) {
    const dir = Math.sign(gesture.accX);
    gesture.accX -= dir * stepX;
    if (!move(dir)) { gesture.accX = 0; break; }
  }

  if (dy > 0) {
    gesture.accY += dy;
    const stepY = cell * CTRL.softStep;
    while (gesture.accY >= stepY) {
      gesture.accY -= stepY;
      if (!softDrop()) { gesture.accY = 0; break; }
    }
  } else {
    gesture.accY = 0;
  }
});

function endGesture(e) {
  if (!gesture || e.pointerId !== gesture.id) return;
  const g = gesture;
  gesture = null;
  if (extraPointers > 0) { extraPointers = 0; return; }
  if (g.dropped || state !== 'playing') return;

  const totalX = e.clientX - g.startX, totalY = e.clientY - g.startY;
  const elapsed = e.timeStamp - g.startT;

  if (-totalY > cell * CTRL.holdSwipe && Math.abs(totalY) > Math.abs(totalX) * 1.5) { holdPiece(); return; }
  if (g.maxDist < CTRL.tapDist && elapsed < CTRL.tapTime) rotate(1);
}

stage.addEventListener('pointerup', endGesture);
stage.addEventListener('pointercancel', e => { if (gesture && e.pointerId === gesture.id) gesture = null; });

// The buttons live inside #stage, so swallow pointerdown or a tap on them
// also registers as a rotate gesture on the board.
for (const id of ['pauseBtn', 'muteBtn']) {
  $(id).addEventListener('pointerdown', e => e.stopPropagation());
}
$('pauseBtn').addEventListener('click', () => { Sound.init(); togglePause(); });
$('muteBtn').addEventListener('click', e => {
  Sound.muted = !Sound.muted;
  localStorage.setItem('blockfall.muted', Sound.muted ? '1' : '0');
  e.currentTarget.textContent = Sound.muted ? '♪̸' : '♪';
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') togglePause();
});
window.addEventListener('resize', resize);
window.visualViewport?.addEventListener('resize', resize);

// ---------- boot ----------

function frame(t) {
  const dt = Math.min(t - lastFrame, 100);
  lastFrame = t;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

stats = loadStats();
grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
queue = []; particles = []; shake = 0; score = 0; lines = 0; level = 1; combo = -1;
deathRow = ROWS; deathTimer = 0;
$('muteBtn').textContent = Sound.muted ? '♪̸' : '♪';
resize();
showMenu();
requestAnimationFrame(t => { lastFrame = t; frame(t); });

})();
</script>
</body>
</html>
