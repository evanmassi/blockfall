<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Blockfall</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<link rel="stylesheet" href="style.css">
<script>
/* Installed, the viewport is 62pt shorter than the screen (812 of 874), and the
   strip below it is painted by the body's background — measured, not assumed.
   The overlay tints the page but never reaches down there, so the two match
   only when the body carries the colour the overlay settles to.

   A style element rather than a style property: body does not exist yet this
   early, and this has to beat the first paint. Inline for the same reason — a
   fetched file lands too late. */
try {
  var paint = localStorage.getItem('blockfall.paint');
  if (/^#[0-9a-f]{6}$/i.test(paint)) {          // only ever a hex colour
    var el = document.createElement('style');
    el.textContent = 'html,body{background:' + paint + '}';
    document.head.appendChild(el);
  }
} catch (e) {}
</script>
</head>
<body>
<div id="app">
  <!-- Three layers, bottom to top: the scrim darkens and blurs the board behind
       it, the debris drift on top of that, and #overlay carries the UI above
       them both. The tint has to be its own element — with it on #overlay the
       debris were either clipped to the viewport (inside) or seen through 90%
       opacity and a 3px blur (outside), which is a glass wall. -->
  <div id="scrim" aria-hidden="true" hidden></div>
  <div id="bgfall" aria-hidden="true" hidden></div>

  <header id="hud">
    <div id="scoreBox">
      <span class="label">SCORE</span>
      <b id="score">0</b>
    </div>
    <div id="subStats">
      <div class="stat"><span class="label">LEVEL</span><b id="level">1</b></div>
      <div class="stat"><span class="label">LINES</span><b id="lines">0</b></div>
      <div class="stat" id="comboStat" hidden><span class="label">COMBO</span><b id="combo">2×</b></div>
    </div>
  </header>

  <div id="sysBtns">
    <button class="sysBtn" id="pauseBtn" aria-label="Pause">❚❚</button>
    <button class="sysBtn" id="muteBtn" aria-label="Mute">♪</button>
  </div>

  <main id="stage">
    <aside class="rail" id="railLeft">
      <div class="slot">
        <span class="label">HOLD</span>
        <canvas id="holdCanvas"></canvas>
      </div>
    </aside>

    <div id="boardWrap">
      <canvas id="board"></canvas>
      <div id="scanlines"></div>
      <div id="toast"></div>
      <div id="countdown"></div>
    </div>

    <aside class="rail" id="railRight">
      <div class="slot">
        <span class="label">NEXT</span>
        <canvas id="nextCanvas"></canvas>
      </div>
      <button id="undoBtn" hidden><span class="label">UNDO</span><b id="undoLeft">0</b></button>
    </aside>
  </main>

  <div id="overlay"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
