<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Blockfall</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<link rel="stylesheet" href="style.css">
<script>
/* Installed, the viewport is shorter than the screen and iOS fills the rest
   from the page background as it stands at first paint — a band below the app
   that JS cannot reach afterwards. This runs before that paint, restoring the
   colour the last session settled on. Inline and tiny on purpose: a separate
   file would be fetched too late to matter. */
try {
  var paint = localStorage.getItem('blockfall.paint');
  if (paint) document.documentElement.style.background = paint;
} catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header id="hud">
    <div id="scoreBox">
      <span class="label">SCORE</span>
      <b id="score">0</b>
    </div>
    <div id="subStats">
      <div class="stat"><span class="label">LEVEL</span><b id="level">1</b></div>
      <div class="stat"><span class="label">LINES</span><b id="lines">0</b></div>
      <div class="stat" id="comboStat" hidden><span class="label">COMBO</span><b id="combo">2×</b></div>
    </div>
  </header>

  <div id="sysBtns">
    <button class="sysBtn" id="pauseBtn" aria-label="Pause">❚❚</button>
    <button class="sysBtn" id="muteBtn" aria-label="Mute">♪</button>
  </div>

  <main id="stage">
    <aside class="rail" id="railLeft">
      <div class="slot">
        <span class="label">HOLD</span>
        <canvas id="holdCanvas"></canvas>
      </div>
    </aside>

    <div id="boardWrap">
      <canvas id="board"></canvas>
      <div id="scanlines"></div>
      <div id="toast"></div>
      <div id="countdown"></div>
    </div>

    <aside class="rail" id="railRight">
      <div class="slot">
        <span class="label">NEXT</span>
        <canvas id="nextCanvas"></canvas>
      </div>
      <button id="undoBtn" hidden><span class="label">UNDO</span><b id="undoLeft">0</b></button>
    </aside>
  </main>

  <div id="overlay"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
